# Serves the Lentra discovery document at /.well-known/nuvio and reverse-proxies
# everything else to Kong (the Supabase API gateway).
#
# Contract enforced by ServerDiscovery.kt / ServerDiscoveryService:
#   - GET {host}/.well-known/nuvio  -> 2xx JSON, <= 64 KB
#   - if the client asked over https, the FINAL url must still be https
#     (so: never redirect https -> http here)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # The app allows up to 64 KB for the discovery document.
    # Keep the payload tiny; this limit just guards against accidents.
    client_max_body_size 10m;

    upstream supabase_kong {
        server kong:8000;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        # 1. Discovery document — must be reachable BEFORE any auth.
        #    Served as static JSON with a short cache so edits take effect.
        # ------------------------------------------------------------------
        location = /.well-known/nuvio {
            alias /usr/share/nginx/html/discovery/nuvio.json;
            default_type application/json;
            add_header Cache-Control "no-store, max-age=0";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Accept, User-Agent";

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ------------------------------------------------------------------
        # 2. Everything else -> Supabase via Kong
        #    /auth/v1/*  /rest/v1/*  /storage/v1/*  /realtime/v1/*
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://supabase_kong;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # PostgREST RPC payloads (sync_push_library_items etc.) can be large.
            proxy_buffering off;
            proxy_request_buffering off;

            # Long-poll friendliness for poll_tv_login_session
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # WebSocket support for realtime
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Health check for `docker compose ps` / uptime monitors
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }

    # nginx needs this map for the WebSocket Connection header above.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
