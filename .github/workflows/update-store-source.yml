name: Update Sideload Source

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sideload-source-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  update:
    name: Update store.json
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download and verify published IPA
        run: |
          release_json="${RUNNER_TEMP}/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${release_json}"

          if [[ "$(jq -r '.draft' "${release_json}")" != "false" ]]; then
            echo "Release ${RELEASE_TAG} is not public." >&2
            exit 1
          fi

          mapfile -t ipa_names < <(jq -r '.assets[] | select(.name | endswith(".ipa")) | .name' "${release_json}")
          if (( ${#ipa_names[@]} != 1 )); then
            echo "Expected exactly one published IPA, found ${#ipa_names[@]}." >&2
            exit 1
          fi

          ipa_name="${ipa_names[0]}"
          mkdir -p source-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ipa_name}" \
            --dir source-assets

          ipa_file="source-assets/${ipa_name}"
          remote_size="$(jq -r --arg name "${ipa_name}" '.assets[] | select(.name == $name) | .size' "${release_json}")"
          remote_digest="$(jq -r --arg name "${ipa_name}" '.assets[] | select(.name == $name) | .digest // empty' "${release_json}")"
          local_size="$(stat -c '%s' "${ipa_file}")"
          local_digest="$(sha256sum "${ipa_file}" | awk '{print $1}')"

          if [[ "${remote_size}" != "${local_size}" ]]; then
            echo "Published IPA size ${remote_size} does not match downloaded size ${local_size}." >&2
            exit 1
          fi
          if [[ "${remote_digest}" != "sha256:${local_digest}" ]]; then
            echo "Published IPA digest ${remote_digest} does not match downloaded digest sha256:${local_digest}." >&2
            exit 1
          fi

      - name: Update sideload source
        run: |
          release_json="${RUNNER_TEMP}/release.json"
          release_notes="${RUNNER_TEMP}/release-notes.md"
          ipa_name="$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .name' "${release_json}")"
          release_date="$(jq -r '.published_at // empty' "${release_json}")"
          download_url="$(jq -r --arg name "${ipa_name}" '.assets[] | select(.name == $name) | .browser_download_url' "${release_json}")"

          if [[ -z "${release_date}" ]]; then
            echo "Published release ${RELEASE_TAG} has no publication date." >&2
            exit 1
          fi

          jq -rj '.body // ""' "${release_json}" > "${release_notes}"
          python3 scripts/update-store-source.py \
            --source store.json \
            --ipa "source-assets/${ipa_name}" \
            --release-notes "${release_notes}" \
            --release-version "${RELEASE_VERSION%-beta}" \
            --release-date "${release_date}" \
            --download-url "${download_url}"

      - name: Commit sideload source
        run: |
          if [[ -z "$(git status --porcelain -- store.json)" ]]; then
            echo "store.json is already current for ${RELEASE_VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json
          git commit -m "chore(store): publish ${RELEASE_VERSION}"
          git push origin "HEAD:${RELEASE_BRANCH}"
