name: Watch NuvioPlusIPTV releases

# homelessbrian/NuvioPlusIPTV is the Android TV app this fork's Live TV features are ported
# from. It can't be git-merged (different codebase), so each of his releases is ported by hand.
# This checks hourly for a release we haven't ported yet and opens one issue per release with
# his notes and the Live TV source files that changed, as the porting checklist.
#
# The last ported version is stored in .livetv-ported-version at the repo root; bump it in the
# commit that finishes a port and the next release gets its own issue.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SOURCE: homelessbrian/NuvioPlusIPTV
  LIVETV_PATH: app/src/main/java/com/nuvio/tv/livetv

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare newest release with the last ported version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PORTED=$(cat .livetv-ported-version 2>/dev/null || echo "")
          LATEST=$(gh api "repos/$SOURCE/releases?per_page=10" --jq '[.[] | select(.draft == false)][0].tag_name')
          echo "Ported: ${PORTED:-none}  Newest: $LATEST"
          [ -n "$LATEST" ] && [ "$LATEST" != "null" ] || { echo "::error::Could not read releases"; exit 1; }
          if [ "$LATEST" = "$PORTED" ]; then echo "Up to date."; exit 0; fi
          TITLE="Port NuvioPlusIPTV $LATEST"
          if gh issue list -R "$GITHUB_REPOSITORY" --search "\"$TITLE\" in:title" --state all --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already exists."; exit 0
          fi
          NOTES=$(gh api "repos/$SOURCE/releases/tags/$LATEST" --jq '.body // ""')
          URL=$(gh api "repos/$SOURCE/releases/tags/$LATEST" --jq '.html_url')
          {
            echo "homelessbrian published **$LATEST** ($URL). Last version ported here: **${PORTED:-none}**."
            echo
            if [ -n "$PORTED" ]; then
              echo "### Live TV files changed since $PORTED"
              echo
              gh api "repos/$SOURCE/compare/$PORTED...$LATEST" --paginate --jq '.files[] | select(.filename | startswith(env.LIVETV_PATH)) | "- [ ] `\(.filename)` (\(.status), +\(.additions)/-\(.deletions))"' \
                | sed "s#$LIVETV_PATH/##" || echo "_(compare failed; diff by hand)_"
              echo
              echo "Full diff: https://github.com/$SOURCE/compare/$PORTED...$LATEST"
            fi
            echo
            echo "### His release notes"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo "When the port lands, set \`.livetv-ported-version\` to \`$LATEST\` in that commit and close this issue."
          } > body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --label "port" --body-file body.md \
            || gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
