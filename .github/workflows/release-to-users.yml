name: Release to Users

# Publishes the phone app to users from the main branch (what was tested and approved), whichever
# branch is picked in the Run workflow menu. Unfinished work on dev is never released.
# The version number is picked automatically: Nuvio Mobile 0.6.6 -> 0.6.6-beta-iptv.1, .2, ...
# The app's built-in updater offers each new release.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown on the release page)"
        required: false
        type: string

permissions:
  contents: write

env:
  APP_NAME: NuvioMobilePlusIPTV

concurrency:
  group: release-to-users
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the version number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -1)
          NUM=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -1)
          if [ -z "$BASE" ] || [ -z "$NUM" ]; then echo "::error::Couldn't read the Nuvio Mobile version"; exit 1; fi
          PREFIX="${BASE%-beta}-beta-iptv."
          LAST=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep -F "$PREFIX" | sed "s/^$(printf '%s' "$PREFIX" | sed 's/[.[\*^$/]/\\&/g')//" \
            | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          if [ "$N" -gt 99 ]; then echo "::error::Too many releases on one Nuvio Mobile version (max 99)"; exit 1; fi
          TAG="$PREFIX$N"
          echo "Nuvio Mobile $BASE -> release $TAG (version code $((NUM * 100 + N)))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$((NUM * 100 + N))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys
        uses: ./.github/actions/app-keys
        with:
          backend_url: ${{ secrets.NUVIO_BACKEND_URL }}
          backend_key: ${{ secrets.NUVIO_BACKEND_KEY }}
          tmdb_api_key: ${{ secrets.TMDB_API_KEY }}
          trakt_client_id: ${{ secrets.TRAKT_CLIENT_ID }}
          trakt_client_secret: ${{ secrets.TRAKT_CLIENT_SECRET }}
          simkl_client_id: ${{ secrets.SIMKL_CLIENT_ID }}
          simkl_app_name: ${{ secrets.SIMKL_APP_NAME }}
          mdblist_client_id: ${{ secrets.MDBLIST_CLIENT_ID }}
          google_drive_client_id: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          google_drive_client_secret: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          premiumize_client_id: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          imdb_ratings_api_base_url: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          imdb_tapframe_api_base_url: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          introdb_api_url: ${{ secrets.INTRODB_API_URL }}

      - name: Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - name: Build APK
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          # Upstream's gradle.properties asks for 12 GB + 8 GB on a 16 GB runner; the VM gets
          # killed at the packaging peak. Fit the build into the runner.
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/; s/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3072M/' gradle.properties
          echo 'org.gradle.workers.max=3' >> gradle.properties
          ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.versionName="$TAG" -Pnuvio.app.versionCode="$CODE" --stacktrace

      - name: Collect APKs
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p out
          for f in $(find androidApp/build/outputs/apk/full/release -name "*.apk"); do
            name=$(basename "$f" .apk)
            cp "$f" "out/$APP_NAME-$TAG-${name#androidApp-full-}.apk"
          done
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: main
          name: Nuvio Mobile + IPTV ${{ steps.ver.outputs.tag }}
          prerelease: true
          files: out/*.apk
          body: ${{ inputs.notes }}

      - name: Update the Downloader link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls out/*arm64-v8a*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls out/*.apk | head -1)
          mkdir -p dl && cp "$APK" "dl/$APP_NAME.apk"
          gh release view downloader -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create downloader -R "$GITHUB_REPOSITORY" --title "$APP_NAME (always the newest version)" \
              --notes "Replaced with the newest build every release." --latest=false --prerelease
          gh release upload downloader "dl/$APP_NAME.apk" -R "$GITHUB_REPOSITORY" --clobber

      # Brings the README from dev onto main, so the front page shows the newest one. Only the README
      # changes on main; the app that was just released is untouched.
      - name: Update the README on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin dev main
          # A separate folder, so files changed by the build above are never touched.
          git worktree add --detach "$RUNNER_TEMP/readme" origin/main
          cd "$RUNNER_TEMP/readme"
          git checkout origin/dev -- README.md
          if git diff --cached --quiet; then echo "README on main is already the newest."; exit 0; fi
          git -c user.name=homelessbrian -c user.email=briansmithhb@gmail.com commit -m "README: newest from dev"
          git push origin HEAD:main
