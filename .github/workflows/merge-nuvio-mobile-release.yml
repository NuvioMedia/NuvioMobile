name: Merge Nuvio Mobile release (manual)

# Use when "Sync Nuvio Mobile releases" stops on a merge conflict. Merges the
# upstream tag keeping the fork's side wherever both changed the same lines,
# then opens a PR so the conflicted files can be fixed by hand before the
# next sync run rebuilds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to merge, e.g. 1.3.0-beta"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge keeping the fork's side on conflicts
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/NuvioMedia/NuvioMobile.git"
          git fetch --no-tags upstream "+refs/tags/$TAG:refs/remotes/upstream/release"
          BR="merge-upstream-$TAG"
          git checkout -b "$BR"
          # Record which files conflicted before -X ours silently resolves them.
          git merge --no-commit refs/remotes/upstream/release || true
          git diff --name-only --diff-filter=U > conflicted.txt || true
          git merge --abort 2>/dev/null || true
          git merge --no-edit -X ours -m "Merge Nuvio Mobile $TAG (fork side kept on conflicts)" refs/remotes/upstream/release
          git push -u origin "$BR"
          {
            echo "Merged upstream $TAG with the fork's side kept in these files; review each by hand:"
            echo
            sed 's/^/- /' conflicted.txt
          } > body.md
          gh pr create --title "Merge Nuvio Mobile $TAG" --body-file body.md --base "${{ github.event.repository.default_branch }}" --head "$BR"
