name: Typecheck native iOS 15 player (fast)

on:
  push:
    branches:
      - ios15-compatibility
    paths:
      - .github/workflows/ios15-player-smoke.yml
      - iosApp/iosApp/Player/LegacyAVPlayerBridge.swift
      - iosApp/iosApp/Player/MPVSoftwareVideoRenderer.swift
      - iosApp/iosApp/Player/PlayerAudioSessionController.swift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Typecheck AVPlayer fallback against iOS 15 SDK
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Typecheck legacy player on iOS 15
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          # Kotlin's generated framework normally supplies this interface.
          # A tiny stub lets Swift typecheck all AVKit/Foundation APIs and the
          # fallback player implementation without a 25-minute Kotlin link.
          cat > "$temp/ComposeAppStub.swift" <<'SWIFT'
          import Foundation
          public protocol NuvioPlayerBridge {}
          public protocol NuvioPlayerBridgeCreator {
              func createBridge() -> any NuvioPlayerBridge
          }
          public class PlayerSystemControlHandler {}
          public class SubtitleTextHandler {}
          SWIFT
          xcrun swiftc -target arm64-apple-ios15.0 \
            -sdk "$sdk" -parse-as-library -emit-module \
            -module-name ComposeApp \
            -emit-module-path "$temp/ComposeApp.swiftmodule" \
            "$temp/ComposeAppStub.swift"
          xcrun swiftc -target arm64-apple-ios15.0 \
            -sdk "$sdk" -I "$temp" -parse-as-library -typecheck \
            -module-name NuvioLegacyPlayerPreflight \
            iosApp/iosApp/Player/PlayerAudioSessionController.swift \
            iosApp/iosApp/Player/LegacyAVPlayerBridge.swift
          echo "The native iOS 15 AVPlayer fallback typechecks successfully."
      - name: Verify internal libmpv software renderer on iOS 15
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          curl --fail --location --retry 3 --silent --show-error --max-time 240 \
            --output "$temp/libmpv.zip" \
            https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libmpv.xcframework.zip
          unzip -q "$temp/libmpv.zip" -d "$temp/framework"
          xcrun swiftc -target arm64-apple-ios15.0 -sdk "$sdk" \
            -F "$temp/framework/Libmpv.xcframework/ios-arm64" \
            -parse-as-library -typecheck \
            iosApp/iosApp/Player/MPVSoftwareVideoRenderer.swift
          echo "The internal libmpv iOS 15 software renderer typechecks."
