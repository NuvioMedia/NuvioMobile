name: Sync Nuvio Mobile releases

# GitHub can't notify a fork when the upstream repo publishes a release, so this
# checks every hour. It only merges and builds when NuvioMedia/NuvioMobile has a
# release this fork hasn't mirrored yet.
#
# When a new upstream release appears (for example 1.3.0-beta), it:
#   1. merges that exact release tag into this fork, keeping the Live TV changes
#   2. builds the Android "full" release APK
#   3. publishes a release in this fork under the same tag
#   4. refreshes the "downloader" release so one link always gives the newest APK
#
# Secrets:
#   SYNC_TOKEN                      PAT (classic) with "repo" + "workflow" scopes, so the
#                                   merge push can itself trigger workflows.
#   NUVIO_LOCAL_PROPERTIES_BASE64   base64 of local.properties with the app keys
#                                   (TMDB, Trakt, Google Drive client ID, …) plus
#                                   NUVIO_RELEASE_STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
#                                   Same layout upstream's android-release.yml expects.
#   NUVIO_RELEASE_KEYSTORE_BASE64   base64 of the fork's own release keystore (.jks).
#                                   Use your own key, not upstream's, so installs don't
#                                   clash with the Play Store build.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Mirror a specific upstream release tag (empty = newest)"
        required: false
        type: string
      include_betas:
        description: "Also mirror pre-releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  UPSTREAM: NuvioMedia/NuvioMobile
  UPSTREAM_BRANCH: cmp-rewrite
  APP_NAME: NuvioMobilePlusIPTV
  INCLUDE_BETAS: ${{ inputs.include_betas == '' && 'true' || inputs.include_betas }}

concurrency:
  group: sync-nuvio-mobile-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      prerelease: ${{ steps.latest.outputs.prerelease }}
      new: ${{ steps.latest.outputs.new }}
    steps:
      - name: Look for a new upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$INCLUDE_BETAS" = "true" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases?per_page=10" --jq '[.[] | select(.draft == false)][0].tag_name')
          else
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not read upstream releases."; exit 1
          fi
          PRE=$(gh api "repos/$UPSTREAM/releases/tags/$TAG" --jq '.prerelease')
          echo "Newest upstream release: $TAG (prerelease: $PRE)"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already mirrored."; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  mirror:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge the upstream release
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          # Private ref so upstream's tag names never collide with ours.
          git fetch --no-tags upstream "+refs/tags/$TAG:refs/remotes/upstream/release"
          if ! git merge --no-edit -m "Merge Nuvio Mobile $TAG" refs/remotes/upstream/release; then
            echo "::error::Upstream $TAG changed the same lines as the Live TV code. Conflicting files:"
            git diff --name-only --diff-filter=U | sed 's/^/::error::  /'
            git merge --abort
            exit 1
          fi
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys and signing
        env:
          RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_PROPERTIES_BASE64" ] || [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 and NUVIO_RELEASE_KEYSTORE_BASE64 are required."; exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$RELEASE_PROPERTIES_BASE64" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "$keystore" >> local.properties
          for p in NUVIO_RELEASE_STORE_PASSWORD NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD; do
            grep -Eq "^$p=.+" local.properties || { echo "::error::$p missing from local.properties"; exit 1; }
          done
          echo "Keys set:"; cut -d= -f1 local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          # Upstream's gradle.properties asks for 12 GB + 8 GB on a 16 GB runner; the VM gets
          # killed at the packaging peak. Fit the build into the runner.
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/; s/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3072M/' gradle.properties
          echo 'org.gradle.workers.max=3' >> gradle.properties
          ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.versionName="$TAG" --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in $(find androidApp/build/outputs/apk/full/release -name "*.apk"); do
            name=$(basename "$f" .apk)
            cp "$f" "out/$APP_NAME-$TAG-${name#androidApp-full-}.apk"
          done
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ steps.merge.outputs.sha }}
          name: Nuvio Mobile + IPTV ${{ env.TAG }}
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          files: out/*.apk
          body: |
            Nuvio Mobile + IPTV, based on Nuvio Mobile ${{ env.TAG }}: everything in Nuvio Mobile, plus Live TV (M3U / Xtream playlists, TV guide, catch-up, recordings, On Demand, Sports) with Google Drive backup that shares one file with Nuvio + IPTV on your TV.

            Upstream changes in this version: https://github.com/${{ env.UPSTREAM }}/releases/tag/${{ env.TAG }}

      - name: Update the Downloader link (always the newest version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls out/*universal*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls out/*.apk | head -1)
          mkdir -p dl && cp "$APK" "dl/$APP_NAME.apk"
          if ! gh release view downloader -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create downloader -R "$GITHUB_REPOSITORY" \
              --title "$APP_NAME (always the newest version)" \
              --notes "This file is replaced with the newest version every release, so one link always installs the latest build." \
              --latest=false --prerelease
          fi
          gh release upload downloader "dl/$APP_NAME.apk" -R "$GITHUB_REPOSITORY" --clobber
