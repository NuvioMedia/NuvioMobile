name: Build and release Nuvio for iOS 15+

on:
  push:
    branches:
      - ios15-compatibility
    paths:
      - .github/workflows/ios15-release.yml
      - iosApp/**
      - composeApp/**
      - scripts/build-ios-ipa.sh
      - scripts/check-ios15-availability.py
      - scripts/verify-nuvio-auth-config.py
      - scripts/preflight-ios15-swift.sh
      - scripts/prepare-ios-dependencies.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvio-ios15-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios15:
    name: Build and publish unsigned iOS 15+ IPA
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      # Kotlin's embedAndSignAppleFrameworkForXcode selects the linker from
      # Xcode's CONFIGURATION. Set BOTH app and framework to Debug. A Release
      # app with KOTLIN_FRAMEWORK_BUILD_TYPE=Debug still linked Release in CI.
      IOS_CONFIGURATION: Debug
      IOS_KOTLIN_FRAMEWORK_BUILD_TYPE: Debug
      KOTLIN_DAEMON_JVMARGS: -Xmx1536M
      NUVIO_GRADLE_JVMARGS: -Xmx3072M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4096M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out compatibility source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # This long-lived compatibility branch needs its own cache. The
          # action defaults to read-only caching outside the default branch.
          cache-read-only: false

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Check Swift syntax and iOS 15 API availability before expensive Kotlin compilation
        run: |
          python3 scripts/check-ios15-availability.py
          test -x scripts/build-ios-ipa.sh
          bash -n scripts/build-ios-ipa.sh
          bash -n scripts/preflight-ios15-swift.sh
          bash scripts/preflight-ios15-swift.sh
          find iosApp -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: Bound CI memory and parallelism
        run: |
          mkdir -p "${HOME}/.gradle"
          # GRADLE_USER_HOME/gradle.properties takes priority over repository defaults,
          # which currently permit 12 GiB for Gradle and 16 GiB for Kotlin/Native.
          # Constrain both processes on the memory-limited macOS runner.
          cat >> "${HOME}/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
          kotlin.native.jvmArgs=-Xmx4096m
          kotlin.daemon.jvmargs=-Xmx1536m
          org.gradle.workers.max=2
          EOF
          tail -n 4 "${HOME}/.gradle/gradle.properties"

      - name: Validate embedded Nuvio login configuration
        run: |
          ./gradlew :composeApp:generateRuntimeConfigs --no-daemon --quiet
          python3 scripts/verify-nuvio-auth-config.py

      - name: Prepare iOS native dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned iOS 15+ IPA (Debug app and Debug Kotlin framework)
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              echo "Top processes by CPU (CPU%, RSS is KiB):"
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          set -o pipefail
          ./scripts/build-ios-ipa.sh 2>&1 | tee "${RUNNER_TEMP}/ios15-build.log"
          if grep -Eq '(> Task :composeApp:linkReleaseFrameworkIosArm64|> Task :composeApp:linkReleaseFrameworkIosSimulatorArm64)' "${RUNNER_TEMP}/ios15-build.log"; then
            echo "::error::Wrong Kotlin framework type: a Release linker ran inside the iOS 15 Debug build."
            exit 1
          fi

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-ios15-failed-build-log
          path: ${{ runner.temp }}/ios15-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate IPA deployment targets and version
        id: verify
        shell: bash
        run: |
          shopt -s nullglob
          ipa_files=(build/ios-ipa/*-full-debug.ipa)
          if [[ ${#ipa_files[@]} -ne 1 ]]; then
            echo "Expected exactly one release IPA; found ${#ipa_files[@]}" >&2
            exit 1
          fi
          ipa="${ipa_files[0]}"
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT
          unzip -p "${ipa}" Payload/Nuvio.app/Info.plist > "${staging}/app.plist"
          unzip -p "${ipa}" Payload/Nuvio.app/PlugIns/DownloadsWidgetExtension.appex/Info.plist > "${staging}/widget.plist"
          app_min="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${staging}/app.plist")"
          widget_min="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${staging}/widget.plist")"
          if [[ "${app_min}" != '15.0' || "${widget_min}" != '15.0' ]]; then
            echo "Incompatible deployment targets: app=${app_min} widget=${widget_min}" >&2
            exit 1
          fi
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${staging}/app.plist")"
          if [[ "${version}" != '1.1.0-beta.3' ]]; then
            echo "Unexpected version: ${version}" >&2
            exit 1
          fi
          {
            echo "## iOS 15+ compatibility IPA"
            echo
            echo "- Version: ${version}"
            echo "- Deployment target: iOS ${app_min}"
            echo "- Widget deployment target: iOS ${widget_min}"
            echo "- SHA-256: $(shasum -a 256 "${ipa}" | awk '{print $1}')"
            echo "- Xcode app: Debug (experimental, unoptimized)"
            echo "- Kotlin/Native framework: Debug (unoptimized)"
            echo "- Nuvio login backend configuration: verified before build"
            echo "- Signing: unsigned (use a compatible sideloading signer)"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "ipa_path=${ipa}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-1.1.0-beta.3-ios15-debug-unsigned-ipa
          path: ${{ steps.verify.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.verify.outputs.ipa_path }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          tag="ios15-${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A release named ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "${tag}" "${IPA_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Nuvio ${VERSION} (iOS 15+ experimental Debug)" \
            --prerelease \
            --notes "Experimental unsigned iOS 15+ compatibility IPA. Fixed missing Nuvio Cloud login configuration using NuvioMedia's official documented public backend URL and client publishable key when no custom backend is set. A CI preflight verifies a non-empty valid HTTPS backend and client key before the full build. Both Xcode app and Kotlin framework use Debug due to memory limits; this is not an optimized production release. Includes iOS 15 Compose navigation and a basic Downloads shortcut widget; Live Activity integration excluded. Sign before installing. Login and playback still need real-device verification."
