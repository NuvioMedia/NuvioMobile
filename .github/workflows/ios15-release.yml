name: Build and release Nuvio for iOS 15+

on:
  push:
    branches:
      - ios15-compatibility
    paths:
      - .github/workflows/ios15-release.yml
      - iosApp/**
      - composeApp/**
      - scripts/build-ios-ipa.sh
      - scripts/prepare-ios-dependencies.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvio-ios15-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios15:
    name: Build and publish unsigned iOS 15+ IPA
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out compatibility source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Prepare iOS native dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned iOS 15+ IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Validate IPA deployment targets and version
        id: verify
        shell: bash
        run: |
          shopt -s nullglob
          ipa_files=(build/ios-ipa/*-full-release.ipa)
          if [[ ${#ipa_files[@]} -ne 1 ]]; then
            echo "Expected exactly one release IPA; found ${#ipa_files[@]}" >&2
            exit 1
          fi
          ipa="${ipa_files[0]}"
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT
          unzip -p "${ipa}" Payload/Nuvio.app/Info.plist > "${staging}/app.plist"
          unzip -p "${ipa}" Payload/Nuvio.app/PlugIns/DownloadsWidgetExtension.appex/Info.plist > "${staging}/widget.plist"
          app_min="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${staging}/app.plist")"
          widget_min="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${staging}/widget.plist")"
          if [[ "${app_min}" != '15.0' || "${widget_min}" != '15.0' ]]; then
            echo "Incompatible deployment targets: app=${app_min} widget=${widget_min}" >&2
            exit 1
          fi
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${staging}/app.plist")"
          if [[ "${version}" != '1.1.0-beta.2' ]]; then
            echo "Unexpected version: ${version}" >&2
            exit 1
          fi
          {
            echo "## iOS 15+ compatibility IPA"
            echo
            echo "- Version: ${version}"
            echo "- Deployment target: iOS ${app_min}"
            echo "- Widget deployment target: iOS ${widget_min}"
            echo "- SHA-256: $(shasum -a 256 "${ipa}" | awk '{print $1}')"
            echo "- Signing: unsigned (use a compatible sideloading signer)"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "ipa_path=${ipa}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-1.1.0-beta.2-ios15-unsigned-ipa
          path: ${{ steps.verify.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.verify.outputs.ipa_path }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          tag="ios15-${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A release named ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "${tag}" "${IPA_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Nuvio ${VERSION} (iOS 15+ experimental)" \
            --prerelease \
            --notes "Experimental iOS 15+ compatibility build. The app uses its Compose navigation fallback on iOS 15. This compatibility IPA registers a basic Downloads widget on all iOS versions; Live Activity widget integration is not bundled in this experimental build. The full-featured newer-iOS release can retain Live Activities. This unsigned IPA must be signed before installation. Verify playback and native dependencies on an iOS 15 device before relying on it."
