name: Live TV check

# Compile and unit-test the shared code on every push to a livetv/* branch, and on
# demand. Faster than a full APK build, and needs no PR.
on:
  push:
    branches: ["livetv/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livetv-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: vpn-android/native/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Write app keys
        uses: ./.github/actions/app-keys
        with:
          backend_url: ${{ secrets.NUVIO_BACKEND_URL }}
          backend_key: ${{ secrets.NUVIO_BACKEND_KEY }}
          tmdb_api_key: ${{ secrets.TMDB_API_KEY }}
          trakt_client_id: ${{ secrets.TRAKT_CLIENT_ID }}
          trakt_client_secret: ${{ secrets.TRAKT_CLIENT_SECRET }}
          simkl_client_id: ${{ secrets.SIMKL_CLIENT_ID }}
          simkl_app_name: ${{ secrets.SIMKL_APP_NAME }}
          mdblist_client_id: ${{ secrets.MDBLIST_CLIENT_ID }}
          google_drive_client_id: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          google_drive_client_secret: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          premiumize_client_id: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          imdb_ratings_api_base_url: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          imdb_tapframe_api_base_url: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          introdb_api_url: ${{ secrets.INTRODB_API_URL }}

      - name: Compile Android and run shared unit tests
        run: |
          chmod +x gradlew
          # Fit the build into the runner's memory (the project's own settings ask for 12 GB + 8 GB).
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/; s/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3072M/' gradle.properties
          echo 'org.gradle.workers.max=3' >> gradle.properties
          ./gradlew :composeApp:compileAndroidMain :composeApp:testAndroidHostTest \
            --tests 'com.nuvio.app.features.livetv.*' --tests '*RootTabHostTest*' --tests '*TraktAuthFlow*' --tests '*Simkl*' \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: List compile tasks (on failure)
        if: failure()
        run: ./gradlew :composeApp:tasks --all -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore | grep -iE "compile|test" || true

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livetv-test-report
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
